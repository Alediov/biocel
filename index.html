<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F5F7FB">
<title>BioCel</title>
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="aparencia.css">
<link rel="stylesheet" href="arte.css">
<link rel="stylesheet" href="alarmes.css">
<link rel="stylesheet" href="colecao.css">
<link rel="stylesheet" href="ferramentas.css">
<link rel="stylesheet" href="academico.css">
<link rel="stylesheet" href="treino.css">
<link rel="stylesheet" href="even3.css">
<link rel="stylesheet" href="jogos-clinicos.css">
<link rel="stylesheet" href="visorZoom.css">
<link rel="stylesheet" href="whatsapp.css">
<link rel="icon" href="icone.png">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2F6BFF"><link rel="apple-touch-icon" href="icone.png"><meta name="apple-mobile-web-app-capable" content="yes"></head>
<body>
<div id="app">
  <header id="topo" class="topo">
    <button class="chip chip-nivel" id="chip-nivel" aria-label="Nível"><span id="v-nivel"></span><span class="mini-barra-nivel"><i id="barra-nivel"></i></span></button>
    <button class="chip chip-xp" id="chip-xp" aria-label="XP de hoje"><svg viewBox="0 0 24 24" class="ico"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span id="v-xp">0</span><span class="mult" id="v-mult" hidden></span></button>
    <button class="chip chip-meta" id="chip-meta" aria-label="Meta do dia">
      <svg viewBox="0 0 36 36" class="anel"><circle cx="18" cy="18" r="15" class="anel-fundo"/><circle cx="18" cy="18" r="15" class="anel-valor" id="anel-meta"/></svg>
      <span id="v-meta">0/8</span>
    </button>
    <button class="chip chip-ofensiva" id="chip-ofensiva" aria-label="Ofensiva">
      <svg viewBox="0 0 24 24" class="ico"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3-1-3 0-6 1-9.5z"/></svg>
      <span id="v-ofensiva">0</span>
    </button>
    <button class="chip chip-moedas" id="chip-moedas" aria-label="Moedas"><svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.8 1.8 0 0 1 0 3.5h-3a1.8 1.8 0 0 0 0 3.5h4" class="ico-traco"/></svg><span id="v-moedas">0</span></button>
    <button class="chip chip-gemas" id="chip-gemas" aria-label="Gemas"><svg class="gema" viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z" fill="#4FD1E8" stroke="#1B2340" stroke-width="1.6" stroke-linejoin="round"/><path d="M2 9h20M8 3l-2 6 6 12 6-12-2-6M12 3v6" fill="none" stroke="#1E8FB3" stroke-width="1.2"/></svg><span id="v-gemas">0</span></button>
  </header>

  <main id="tela" class="tela"></main>

  <nav id="abas" class="abas">
    <button data-aba="trilha" class="aba ativa"><svg viewBox="0 0 24 24"><path d="M6 20c0-4 12-4 12-8S6 8 6 4"/><circle cx="6" cy="4" r="2"/><circle cx="18" cy="12" r="2"/><circle cx="6" cy="20" r="2"/></svg><span>Trilha</span></button>
    <button data-aba="colecao" class="aba"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="11" height="15" rx="2" transform="rotate(-8 8.5 12.5)"/><rect x="10" y="4" width="11" height="15" rx="2"/><path d="M15.5 9l1.2 2.4 2.6.3-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.3z" fill="currentColor" stroke="none"/></svg><span>Coleção</span></button>
    <button data-aba="loja" class="aba"><svg viewBox="0 0 24 24"><path d="M4 9h16l-1.5 11h-13z"/><path d="M8 9V7a4 4 0 0 1 8 0v2"/></svg><span>Loja</span></button>
    <button data-aba="perfil" class="aba"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span>Perfil</span></button>
  </nav>
</div>

<div id="camada-licao" class="camada-licao" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
<canvas id="confete" class="confete"></canvas>

<script type="module" src="js/main.js"></script>
</body>
</html>
